<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeCraft Harness · 控制台</title>
<style>
:root{color-scheme:dark;--bg:#10141c;--panel:#181e29;--line:#303b4e;--text:#e6edf7;--muted:#a5b1c5;--accent:#8cb7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{padding:24px 32px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}h1{margin:0;font-size:23px}h2{font-size:20px}h3{font-size:15px}p{margin:6px 0 14px}.muted,small{color:var(--muted)}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);max-width:1500px;margin:auto}aside{border-right:1px solid var(--line);padding:24px}main{padding:24px 32px;min-width:0}form{display:grid;gap:14px}label{display:grid;gap:5px;font-size:14px}input,textarea,select,button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 12px;min-width:0;max-width:100%}input,select,textarea{width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button.primary{background:#2858a6;border-color:#4d7dce;color:white}button:hover:enabled{border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}label.check{display:flex;align-items:center;gap:8px}input[type=checkbox]{width:auto}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}.metric{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.metric strong{display:block;font-size:19px;overflow-wrap:anywhere}.metric span{font-size:12px;color:var(--muted)}.run{width:100%;display:block;text-align:left;white-space:pre-line;font-size:13px;margin:8px 0;overflow-wrap:anywhere}.run[aria-current=true]{border-color:var(--accent)}pre,code{font-family:Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}pre{background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:8px}ol{padding-left:22px}li{padding:9px 0}.badge{display:inline-block;padding:3px 10px;background:#263753;border-radius:20px;font-size:13px}[data-status=done]{background:#164b35}[data-status=failed],[data-status=interrupted]{background:#703741}#notice{padding:0 32px;color:#ffd69b;overflow-wrap:anywhere}#error{color:#ffd69b}#local-fields{display:grid;gap:12px}[hidden]{display:none!important}.token{max-width:280px}#empty{padding:60px 0;max-width:560px}details{margin-top:15px}summary{cursor:pointer}a{color:var(--accent)}@media(max-width:850px){header{align-items:flex-start;flex-direction:column;padding:20px}.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:20px}main{padding:20px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.token{max-width:100%;width:100%}#runs{max-height:220px;overflow:auto}#notice{padding:0 20px}}
</style></head><body>
<header><div><h1>CodeCraft Harness</h1><p class="muted">单 Agent 代码修复工作台 · 本机自部署</p></div><label class="token">API token（如服务端已配置）<input id="token" type="password" autocomplete="off" placeholder="仅保存在当前页面"></label></header>
<p id="notice" role="status" aria-live="polite"></p>
<div class="layout"><aside><h2>新建任务</h2><form id="new-run">
<label>运行模式<select id="mode"><option value="offline_demo">离线固定演示 · 零模型费用</option><option value="local">本地模型 · 需已有服务</option></select></label><small id="mode-help"></small>
<label>任务包<select id="pack" required></select></label>
<div id="local-fields" hidden><label>模型名称<input id="model" maxlength="128" placeholder="默认使用服务端模型名称"></label><label>任务目标（空则用任务包说明）<textarea id="goal" maxlength="20000" rows="3"></textarea></label></div>
<label>Token 预算<input id="budget" type="number" min="1" max="1000000" value="30000" required></label>
<label class="check"><input id="plan" type="checkbox">执行前规划</label><label class="check"><input id="compress" type="checkbox">压缩旧步骤上下文</label>
<button id="submit" class="primary" type="submit">创建并执行</button></form>
<div class="row"><h2>运行记录</h2><button id="refresh" type="button">刷新</button></div><div id="runs"></div>
</aside><main><section id="empty"><h2>先体验一次完整修复</h2><p>选择离线演示，无需密钥。固定脚本会运行原始测试、读取代码、修复并再次验证；所有修改保存在独立工作区。</p><p class="muted">离线演示展示工程机制，不代表真实模型理解或修复任意项目的能力。本机测试会执行任务代码，仅用于可信源码。</p></section>
<section id="detail" hidden><div class="row"><h2 id="run-title"></h2><span id="status" class="badge"></span></div><p id="evidence" class="muted"></p><code id="run-id"></code>
<div class="metrics"><div class="metric"><strong id="verified"></strong><span>冻结测试验证</span></div><div class="metric"><strong id="steps"></strong><span>已保存步骤</span></div><div class="metric"><strong id="usage"></strong><span>已知 Token / 预算</span></div><div class="metric"><strong id="unknown"></strong><span>用量未知的调用</span></div></div>
<p id="error" role="status"></p><div class="row"><label id="budget-row" hidden>新的总预算<input id="new-budget" type="number" min="1" max="1000000"></label><button id="resume" hidden>人工续跑一段</button><button id="download">下载结果摘要</button></div>
<details><summary>工作区与审批记录</summary><pre id="workspace"></pre><pre id="approvals"></pre></details>
<h3>执行记录</h3><div class="row"><button id="prev">上一页</button><span id="trace-page"></span><button id="next">下一页</button></div><ol id="traces"></ol></section></main></div>
<script type="module" src="./app.js"></script></body></html>
