services:
  backend:
    build: .
    image: codecraft-harness:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CODECRAFT_MODE: offline_demo
      CODECRAFT_DATA_DIR: /data
      CODECRAFT_API_TOKEN: ${CODECRAFT_API_TOKEN:-}
    volumes:
      - harness_data:/data
volumes:
  harness_data:
