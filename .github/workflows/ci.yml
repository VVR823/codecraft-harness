name: Offline quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    timeout-minutes: 10
    env:
      CODECRAFT_MODE: offline_demo
      CODECRAFT_ALLOW_REMOTE: 'false'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python scripts/check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ui/tests/console.test.mjs ../showcase/tests/ui.test.mjs
      - name: Official local MCP reference server
        run: |
          npm install --prefix .mcp-verify @modelcontextprotocol/server-everything@2026.8.31
          python scripts/verify_mcp_real.py
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codecraft-ci .
      - name: Non-root runtime and offline SDK smoke
        run: |
          test "$(docker run --rm codecraft-ci id -u)" = 10001
          docker run --rm codecraft-ci smoke --data-dir /data/smoke
