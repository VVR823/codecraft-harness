name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Verify MCP against official server (real ecosystem)
        run: |
          # 自研 MCP client 对接官方 @modelcontextprotocol/server-everything
          # 全链验证（initialize → tools/list → tools/call）——生态兼容由 CI 背书
          node --version
          npm install --prefix .mcp-verify @modelcontextprotocol/server-everything
          python scripts/verify_mcp_real.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t codecraft-harness:ci .

      - name: Smoke test — health endpoint
        run: |
          docker run -d --name cc-harness -p 8000:8000 codecraft-harness:ci
          sleep 8
          curl -fsS http://localhost:8000/health
          docker stop cc-harness

      - name: Smoke test — drive mode entry chain
        run: |
          # 验证 `drive` 模式入口链（entrypoint → scripts/drive_task.py argparse）
          # argparse --help 合法退出码 0，不真烧 LLM token
          docker run --rm codecraft-harness:ci drive --help

